  default_risk_pct: 0.1
  circuit_break_pct: 0.15

# 重构控制配置
refactoring:
  enabled: false
  feature_flags:
    signal_arbitration: true
    typed_contracts: false
    factor_gate: "block"
    engine_migration:
      regime: false
      ntf: false
      lppl: false
      czsc: false
      alpha: false
      wyckoff: false
      decision: false
    event_bus: true
    async_event_bus: false
    observability: false
    use_research_data_pack: true
  time:
    provider: "real"

# 批处理配置
batch:
  max_workers: null  # 并行线程数; null = cpu_count//2, 1 = 串行, N = 指定线程数

# 核心逻辑配置
brain:
  alpha_decoupler:
    benchmark_thresholds:
      large_cap: 50000000000  # 50B
      mid_cap: 10000000000    # 10B
    window: 20
  
  ntf:
    volume_ratio_threshold: 2.0
    window: 5
    
  regime:
    entropy_threshold: 0.2
    turnover_z_limit: 3.0
    min_data_points: 30
  
  fsm:
    ma_short: 20
    ma_long: 60
    sell_threshold: -0.5
    buy_block_threshold: -0.3
    circuit_break_threshold: -0.05

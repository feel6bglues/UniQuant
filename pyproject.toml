[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "uniquant"
version = "0.1.0"
description = "Unified Quantitative Trading Platform (TDX Alpha Tactician + LPPL)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pyarrow>=14.0.0,<24.0.0",
    "requests>=2.31.0",
    "akshare>=1.12.0,<2.0.0",
    "mootdx>=0.11.7,<1.0.0",
    "joblib>=1.3.0,<2.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "loguru>=0.7.0",
    "filelock>=3.10.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.0",
    "numba>=0.58.0,<1.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "duckdb>=0.9.0",
    "xxhash>=3.4.0",
    "markdown>=3.5.0",
    "sqlalchemy>=2.0.0",
    "pybreaker>=1.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.0.0",
]
tdx = ["pytdx>=1.72", "tdxpy>=0.2.5"]
baostock = ["baostock>=0.8.9"]
curl = ["curl-cffi>=0.5.0"]
report = ["weasyprint>=60.0"]
js = ["py-mini-racer>=0.6.0"]
all = ["uniquant[tdx,baostock,curl,report,js]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# Standalone research scripts bootstrap sys.path before importing the
# installed package / src namespace, so imports legitimately appear below
# the path setup.
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=src/uniquant --cov-fail-under=50 --cov-report=term-missing"
norecursedirs = ["archive", ".*", "build", "dist", "node_modules"]

[tool.mypy]
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["tests/", "scripts/"]

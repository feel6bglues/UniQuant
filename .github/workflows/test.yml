name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --local

      - name: Lint with ruff
        run: ruff check src/uniquant/ tests/ scripts/

      - name: Verify evidence manifest
        # The data lake and bulk research output are not tracked; the structured
        # evidence behind published conclusions is, and is covered by a
        # content-hash ledger. Fail if that ledger drifts from the tree.
        run: python scripts/maintenance/evidence_manifest.py verify

      - name: Test with pytest
        # Real-data regression tests read the local, gitignored data lake
        # (data/lake/**), the GBBQ baseline (data/fq/gbbq.parquet) and/or the
        # local TDX client; none of these exist on a CI runner. They declare
        # that dependency via the `requires_lake` / `requires_futures_lake` /
        # `requires_gbbq` markers (tests/conftest.py) and skip with an explicit
        # reason rather than failing — or worse, passing vacuously on an empty
        # frame. Everything else must pass for real here.
        #
        # Tests must also never hardcode a developer-machine absolute path. Doing
        # so resolved locally but aborted the *whole* CI session during pytest
        # collection (`Interrupted: 1 error during collection`, exit 2, zero
        # tests run). `tests/test_no_dev_absolute_paths.py` guards against it.
        # Related: tests must not mutate the process environment at import time
        # (`os.environ[...] = ...` at module level) — pytest imports every module
        # into one process, so a stray `HOME` write silently changed which
        # real-data tests ran (it skipped 5 of them). Guarded by
        # `tests/test_no_import_time_env_mutation.py`.
        #
        # Related (round 7): logging calls must not declare a different number of
        # `%`-placeholders than they supply positional args. stdlib logging does
        # `msg % args`, so a `logger.warning("... {} ...", a, b)` raises
        # `TypeError`. It happened to be swallowed by pytest's log-capture handler
        # locally but propagated elsewhere (e.g. CI), turning a validation
        # *failure* into an empty result with all per-metric detail lost. Guarded
        # by `tests/test_no_logging_format_mismatch.py` — see report §7.10.
        #
        # Also note: `czsc` is not a declared dependency, so it is absent here.
        # Four modules guard themselves with `pytest.importorskip("czsc")` and
        # are therefore not collected in CI (30 cases), while
        # `tests/test_brain_boundary_qa.py` skips 9 more. That is expected, and
        # it is why CI's pass/skip counts differ from a developer machine — see
        # report §7.9 before "correcting" those counts.
        run: |
          set +e
          pytest tests/ -q --tb=short > /tmp/pytest.log 2>&1
          rc=$?
          cat /tmp/pytest.log
          if [ "$rc" -ne 0 ]; then
            # Publish a bounded digest as check-run annotations. A collection
            # error aborts the session with "Interrupted: N errors during
            # collection" and a tiny log, which is hard to triage from the
            # Checks tab alone; these annotations make the root cause visible
            # without downloading step logs.
            {
              grep -E 'Interrupted|errors? during collection' /tmp/pytest.log | head -3
              grep -E '^E   ' /tmp/pytest.log | head -12
              grep -E '^(ERROR|FAILED) ' /tmp/pytest.log | head -10
            } 2>/dev/null | awk '!seen[$0]++' | head -20 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do echo "::error title=pytest-digest::${line}"; done
          fi
          exit $rc

  coverage:
    # Separate job so the fast `test` job above still gives quick feedback.
    # `--cov-fail-under` is a *regression floor*. Two measurements are on record
    # (round 8, 2026-10-17 — the `hands/` dead-cluster prune (−676 statements)
    # plus 169 new coverage tests lifted the lower figure by another ~3.4 points):
    #   * 80.91% (25,171 stmts / 4,805 missed) — CI-faithful environment: no data
    #     lake (so the `requires_*` real-data tests skip) AND only the declared
    #     install `pip install -e ".[all,dev]"`. The latter matters: `czsc` is
    #     NOT a declared dependency, so CI never installs it, which leaves the
    #     four `pytest.importorskip("czsc")` modules uncollected and
    #     `brain/czsc/czsc_engine.py` entirely uncovered. Always measure with the
    #     same dependency set as CI — see report §7.9.
    #   * 82.20% (25,171 stmts / 4,480 missed) — developer machine WITH the local
    #     data lake and the manually installed (undeclared) `czsc`, where the
    #     skipped tests actually run.
    # Round 8 raised the floor 74 -> 78: it now sits ~2.9 points below the *lower*
    # (CI-faithful) measurement, restoring the ~2-point environmental margin
    # policy set in round 3 — instead of the 6.9-point slack the round-8 jump
    # would otherwise have left (a 6.9-point floor is no longer a regression
    # detector). Keep the floor a floor: if a future change trips it, add tests,
    # do not lower it.
    # Layer coverage (round 8, CI-faithful; weakest first): brain 69.13%,
    # risk 73.14%, services 79.34%, shared 87.66%, signal 91.06%, data 92.95%,
    # research 94.32%, hands 99.81% — `brain/` replaces `hands/` as the weakest
    # layer (round 8 lifted `hands/` 64.19% -> 99.81%).
    # See `.coveragerc` and
    # docs/analysis/POST_SIMPLIFICATION_ARCHITECTURE_TRADING_EVALUATION_20261016.md
    # §7.6 / §7.8 / §7.9 / §7.10 / §7.11.
    # The repository coding standard's 80% aspiration is now MET on both
    # measurements (80.91% CI-faithful / 82.20% dev); this gate still only
    # guarantees coverage never silently drops.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Test with coverage gate
        run: |
          set +e
          pytest tests/ -q --tb=short \
            -n auto \
            --timeout=900 \
            --cov \
            --cov-report=term:skip-covered \
            --cov-fail-under=78 > /tmp/pytest_cov.log 2>&1
          rc=$?
          cat /tmp/pytest_cov.log
          if [ "$rc" -ne 0 ]; then
            # Same bounded digest as the `test` job so a failure here is
            # triageable from the Checks tab without downloading step logs.
            {
              grep -E 'Interrupted|errors? during collection' /tmp/pytest_cov.log | head -3
              grep -E 'Required test coverage|FAIL Required' /tmp/pytest_cov.log | head -3
              grep -E '^E   ' /tmp/pytest_cov.log | head -12
              grep -E '^(ERROR|FAILED) ' /tmp/pytest_cov.log | head -10
            } 2>/dev/null | awk '!seen[$0]++' | head -20 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do echo "::error title=pytest-digest::${line}"; done
          fi
          exit $rc
